name: X Post - Collect Trend Words

# ジャンル(恋愛)の投稿検索から、よく使われているハッシュタグをTrendWordとして収集する。
# 公式のトレンドAPIはProティア以上が必要で使えないため、代わりに自前で作る代用の
# トレンド情報(src/xPoster/trendWords.ts)。生成された投稿は、これを「無理に使う必要は
# ない」ヒントとして参照する(generatePost.ts等)。
#
# 自動実行は一時停止中(X APIクレジット消費が大きいため)。6クエリ×毎回最大100件読み取り
# しており、4時間おきに動かすと1日あたり最大$12前後かかる計算になる。運用者が
# 「いったん完全に止めよう」と判断し、native scheduleを止めた。再開する場合は下のscheduleの
# コメントアウトを外すか、必要な時だけworkflow_dispatchで手動実行する
# (max_resultsを100より絞るなどのコスト見直しとあわせて検討すること)。
#
# - cron: "7 */4 * * *"

on:
  workflow_dispatch: {}

concurrency:
  group: console-state
  cancel-in-progress: false

env:
  DATABASE_URL: file:./bot.db

jobs:
  collect-trends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Collect trend words
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: npm run x-post:collect-trends

      - name: Persist bot database
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prisma/bot.db
          git diff --cached --quiet || git commit -m "chore(bot): update state after x-post trend word collection [skip ci]"
          git pull --rebase --autostash
          git push
