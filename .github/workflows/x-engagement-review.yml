name: X Engagement - Review Comment

# Xリプライ検討issue(x-engagement-reply-promptラベル)に、投稿しようとしているリプライ案が
# コメントされたら、それをレビューするためのClaude.aiプロンプトを1回だけ自動で返信する
# (src/cli/postXEngagementReviewComment.ts)。Claude APIは呼ばない。
# 「1回だけ」はWatchedPost.reviewCommentPostedAtで保証しており、2回目以降のコメントには
# 反応しない。botが自分で投稿したコメントへの自己反応(無限ループ)も防ぐ。

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "レビュー用プロンプトを生成するissue番号(Xリプライ検討issue)。コメント連投時のconcurrency競合でキャンセルされ、レビューが返らなかった場合などに使う"
        required: true
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: console-state
  cancel-in-progress: false

env:
  DATABASE_URL: file:./bot.db

jobs:
  review-comment:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.issue.labels.*.name, 'x-engagement-reply-prompt') &&
       github.event.comment.user.login != 'github-actions[bot]')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Post review prompt comment
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run x-engagement:review-comment

      - name: Persist bot database
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prisma/bot.db
          git diff --cached --quiet || git commit -m "chore(bot): update state after x-engagement review comment [skip ci]"
          git pull --rebase --autostash
          git push
