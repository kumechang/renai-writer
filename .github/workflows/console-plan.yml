name: Console - Editor Planning Prompt

# issueが新規作成されたら、編集者への企画立案プロンプトを自動投稿する。
# Anthropic APIは呼び出さない(プロンプトを生成してissueに書き込むだけ)。

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: console-state
  cancel-in-progress: false

env:
  DATABASE_URL: file:./bot.db
  RESEARCH_API_BASE_URL: http://localhost:3000
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  plan:
    # 1企画から生成された記事用のsub-issue(auto-articleラベル付き)や、X投稿承認issue
    # (pending-x-post-approvalラベル付き、x-post-generate.ymlが作成する)では発火しない。
    # このワークフローはテーマを書いたissueに対してのみ実行する。
    if: >
      !contains(github.event.issue.labels.*.name, 'auto-article') &&
      !contains(github.event.issue.labels.*.name, 'pending-x-post-approval')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Start API server
        run: |
          npm run ci:server &
          echo $! > server.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && exit 0
            sleep 1
          done
          echo "API server did not become healthy in time" >&2
          exit 1

      - name: Post editor planning prompt to the issue
        run: npm run console -- plan --issue ${{ github.repository }}#${{ github.event.issue.number }}

      - name: Stop API server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true

      - name: Persist bot database
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prisma/bot.db
          git diff --cached --quiet || git commit -m "chore(bot): update state for issue #${{ github.event.issue.number }} [skip ci]"
          git pull --rebase --autostash
          git push
