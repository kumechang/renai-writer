name: X Engagement - Handle Approval

# Xリプライ承認issueへのコメントを検知する。「承認」「却下」ならその通り処理し、
# それ以外の自由記述コメントは次回以降の生成に活かすフィードバックとして記録する
# (x-post-approval.ymlと同じ構成)。「承認」された場合も、X APIへの投稿は行わない
# (X APIの自動化ルール上できないため。issueに手動投稿を促すコメントを残すのみ)。
# このワークフローはX APIへの書き込みを行わないため、X_API_KEY等の認証情報は不要。

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: console-state
  cancel-in-progress: false

env:
  DATABASE_URL: file:./bot.db

jobs:
  handle-approval:
    runs-on: ubuntu-latest
    # pending-x-engagement-approvalラベルが無いissueには反応しない(記事issueや
    # X投稿承認issueとのやり取りと衝突しないためのガード)。botが自分で投稿した結果コメント
    # への自己反応(無限ループ)も防ぐ。
    if: >
      contains(github.event.issue.labels.*.name, 'pending-x-engagement-approval') &&
      github.event.comment.user.login != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Handle approval comment
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run x-engagement:handle-approval

      - name: Persist bot database
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prisma/bot.db
          git diff --cached --quiet || git commit -m "chore(bot): update state after x-engagement approval [skip ci]"
          git pull --rebase --autostash
          git push
