name: X Engagement - Collect

# config/x-watch-accounts.jsonに登録したウォッチ対象アカウント(「フォロワー1万人以上の
# 憧れのアカウント」5〜10件)の新着投稿をX APIから取得し、WatchedPostとして保存する。
# 「彼らが投稿した瞬間に」リプライを返すというアドバイスの狙いに沿うよう、検知自体は
# 高頻度(15分おき)で行う。実際のリプライ生成・投稿はx-engagement-generate.ymlが
# 別ワークフローとして1日の上限に沿ったペースで行う。
#
# ウォッチ対象アカウント全員分をX APIの投稿検索(`from:user1 OR from:user2 OR ...`)で
# 1回のAPI呼び出しにまとめて取得する(src/xEngagement/fetchNewPosts.ts)ため、
# アカウント数が増えてもAPI呼び出し数自体は増えない(クエリ文字数の上限に達するまで)。
#
# GitHub Actionsのscheduleは数時間〜1日単位で遅延・スキップされることがあり
# (x-post-generate.ymlで確認済み)、15分おきのような高頻度実行では特に顕著になりうる。
# 確実性を優先する場合は、外部のcronサービス(cron-job.orgなど)からworkflow_dispatch APIを
# 15分おきに叩く方式を主経路にすること。native scheduleは保険として残す。

on:
  schedule:
    # 1日1回(保険)。cron-job.orgが正常に動いている限りこちらは実行されない想定だが、
    # cron-job.org自体が丸ごと止まった場合の最終防衛ラインとして残す。以前は15分おきに
    # していたが、cron-job.org(同じく15分おき)と競合してbot.dbのpush時にレース
    # (バイナリのマージコンフリクト)が発生したため、頻度を落とした
    # (根本原因はactions/checkoutのref固定で対処済みだが、そもそも同じ処理を
    # 二重に走らせる必要が無いため)。
    - cron: "13 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: console-state
  cancel-in-progress: false

env:
  DATABASE_URL: file:./bot.db

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Collect new posts from watched accounts
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: npm run x-engagement:collect

      - name: Persist bot database
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prisma/bot.db
          git diff --cached --quiet || git commit -m "chore(bot): update state after x-engagement collect [skip ci]"
          git pull --rebase --autostash
          git push
