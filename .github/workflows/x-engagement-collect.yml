name: X Engagement - Collect

# 特定アカウントの監視ではなく、恋愛・婚活ジャンルのキーワード横断検索
# (config/x-engagement-search.json)で直近の投稿を取得し、インプレッション数が
# しきい値を超えているものだけ(1ユーザーあたり1件)をGitHub issue(Claude.aiの
# チャットに貼り付けるリプライ検討プロンプト)にする(src/xEngagement/findReplyCandidates.ts)。
# Claude APIは呼ばないため、issueを何件作ってもAPI使用量は増えない。
#
# コストは1回の実行につき「取得件数 × 約$0.005」で固定される(ユーザー情報は取得しない
# ため、追加コストは発生しない)。既定値(10件)なら1回あたり約$0.05。1日1回の実行を
# 想定しており、GitHub Actionsの標準scheduleの遅延・スキップ(数時間程度)は許容できるため、
# 外部のcronサービスは使わない。

on:
  schedule:
    # 1日1回(JST12時ごろ)。
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: console-state
  cancel-in-progress: false

env:
  DATABASE_URL: file:./bot.db

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Find high-impression reply candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: npm run x-engagement:collect

      - name: Persist bot database
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prisma/bot.db
          git diff --cached --quiet || git commit -m "chore(bot): update state after x-engagement collect [skip ci]"
          git pull --rebase --autostash
          git push
