name: X Post - Analyze Posting Times

# 週1回、投稿ごとのエンゲージメント実績を時間帯別に集計してClaudeに分析させ、
# PostingTimeWeightを更新する。shouldGenerateNow(生成パイプライン)がこの重みを
# 参照し、反応の良い時間帯を優先して投稿候補を作るようになる
# (amazon-sentaku-shiageのanalyze-posting-times.ymlを流用)。

on:
  schedule:
    # 毎週日曜 JST 09:37 (UTC 00:37)
    - cron: "37 0 * * 0"
  workflow_dispatch: {}

concurrency:
  group: console-state
  cancel-in-progress: false

env:
  DATABASE_URL: file:./bot.db

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Analyze posting times
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run x-post:analyze-posting-times

      - name: Persist bot database
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prisma/bot.db
          git diff --cached --quiet || git commit -m "chore(bot): update state after x-post posting-time analysis [skip ci]"
          git pull --rebase --autostash
          git push
