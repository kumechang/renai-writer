name: X Post - Collect Metrics

# 投稿済みツイートのエンゲージメント(いいね・リポスト等)を毎日取得し、
# analyzePostingTimes(時間帯の投稿重み算出)の材料にする
# (amazon-sentaku-shiageのcollect-metrics.ymlを流用)。

on:
  schedule:
    # JST 08:27 (UTC 23:27 前日)。毎時0分ちょうどは混雑で遅延・スキップされやすいため
    # 分をずらしている。
    - cron: "27 23 * * *"
  workflow_dispatch: {}

concurrency:
  group: console-state
  cancel-in-progress: false

env:
  DATABASE_URL: file:./bot.db

jobs:
  collect-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Collect engagement metrics
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: npm run x-post:collect-metrics

      - name: Persist bot database
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prisma/bot.db
          git diff --cached --quiet || git commit -m "chore(bot): update state after x-post metrics collection [skip ci]"
          git pull --rebase --autostash
          git push
