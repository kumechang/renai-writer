name: Console - Check Reply

# issueに新しいコメントが付いたら、保留中のプロンプトへの返信かどうかを確認し、
# あれば解析して次のプロンプト(または完成した記事)をissueに投稿する。
# github-actions[bot] 自身が投稿したコメント(プロンプトや結果)では発火しないようにする。
# Anthropic APIは呼び出さない。

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: console-state
  cancel-in-progress: false

env:
  DATABASE_URL: file:./bot.db
  RESEARCH_API_BASE_URL: http://localhost:3000
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  check:
    # X投稿承認issue(pending-x-post-approvalラベル付き)への「承認」/「却下」コメントは
    # x-post-approval.ymlが処理するため、このワークフローでは反応しない
    # (反応しても実害はない設計だが、無駄なActions実行を避けるため明示的に除外する)。
    if: >
      github.event.comment.user.login != 'github-actions[bot]' &&
      !contains(github.event.issue.labels.*.name, 'pending-x-post-approval')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Start API server
        run: |
          npm run ci:server &
          echo $! > server.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && exit 0
            sleep 1
          done
          echo "API server did not become healthy in time" >&2
          exit 1

      - name: Check for a console reply and advance
        run: npm run console -- check --issue ${{ github.repository }}#${{ github.event.issue.number }}

      - name: Stop API server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true

      - name: Persist bot database
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prisma/bot.db
          git diff --cached --quiet || git commit -m "chore(bot): update state for issue #${{ github.event.issue.number }} [skip ci]"
          git pull --rebase --autostash
          git push
